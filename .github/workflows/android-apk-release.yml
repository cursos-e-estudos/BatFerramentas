name: Android APK Release

on:
  push:
    branches:
      - build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: build-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          gh release create "$TAG_NAME" \
            android/app/build/outputs/apk/debug/app-debug.apk#BatSenhas.apk \
            --target "$GITHUB_SHA" \
            --title "BatSenhas build $GITHUB_RUN_NUMBER" \
            --notes "Automated APK for commit $GITHUB_SHA on branch $GITHUB_REF_NAME."